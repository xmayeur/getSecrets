[pytest]
# Pytest configuration for getSecrets

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Test paths
testpaths = tests

# Coverage options (if pytest-cov is installed)
# addopts = -v --cov=getSecrets --cov-report=html --cov-report=term

# Markers for categorizing tests
markers =
    unit: Unit tests with mocking (fast, no external dependencies)
    integration: Integration tests requiring Vault server or config
    slow: Tests that take significant time to run

# Ignore patterns
norecursedirs = .git .tox dist build *.egg venv docs

# Minimum Python version
minversion = 3.6
